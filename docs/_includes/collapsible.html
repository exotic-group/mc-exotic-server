<div class="collapsible" data-collapsible>
  <div class="collapsible__header" data-collapsible-toggle>
    <h2>{{ include.title }}{% if include.wip %}<span class="wip-badge">WIP</span>{% endif %}</h2>
    <svg class="collapsible__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>
  <div class="collapsible__body">
    {{ include.content }}
  </div>
</div>
